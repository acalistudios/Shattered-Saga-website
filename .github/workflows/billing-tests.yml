name: Billing safety tests
on:
  push:
    paths: ['api-worker/**', '.github/workflows/billing-tests.yml']
  pull_request:
    paths: ['api-worker/**', '.github/workflows/billing-tests.yml']
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-worker/package-lock.json
      - run: npm ci
        working-directory: api-worker
      - run: npm run test:billing
        working-directory: api-worker
      - run: npx tsc --noEmit
        working-directory: api-worker
